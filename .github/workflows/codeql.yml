# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '16 0 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read
      
      # required to comment on pull requests
      issues: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: autobuild
        # CodeQL supports the following values keywords for 'language': 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
        # Use `c-cpp` to analyze code written in C, C++ or both
        # Use 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # To learn more about changing the languages that are analyzed or customizing the build mode for your analysis,
        # see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.
        # If you are analyzing a compiled language, you can modify the 'build-mode' for that language to customize how
        # your codebase is analyzed, see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Add any setup steps before running the `github/codeql-action/init` action.
    # This includes steps like installing compilers or runtimes (`actions/setup-node`
    # or others). This is typically only required for manual builds.
    # - name: Setup runtime (example)
    #   uses: actions/setup-example@v1

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # If the analyze step fails for one of the languages you are analyzing with
    # "We were unable to automatically build your code", modify the matrix above
    # to set the build mode to "manual" for that language. Then modify this step
    # to build your code.
    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
    - if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
    
    # New step: Validate CodeQL results against CVE datasheet
    - name: Setup Python for Security Validation
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install Python dependencies for validation
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt
    
    - name: Validate Security Findings Against CVE Database
      run: |
        python scripts/validate_codeql_results.py \
          --cve-datasheet CVE_Datasheet_Populated_v3.xlsx \
          --output security_compliance_report.xlsx
      continue-on-error: true
    
    - name: Upload Security Compliance Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-compliance-report-${{ matrix.language }}
        path: |
          security_compliance_report.xlsx
          security_compliance_report*.csv
        retention-days: 30
    
    - name: Comment Security Report Summary
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          try {
            // Try to read the CSV summary file if Excel is not available
            let summary = '## 🔒 Security Compliance Analysis Summary\n\n';
            let reportFound = false;
            
            // Check for summary CSV file
            const summaryFiles = ['security_compliance_report_summary.csv'];
            for (const summaryFile of summaryFiles) {
              if (fs.existsSync(summaryFile)) {
                const csvContent = fs.readFileSync(summaryFile, 'utf8');
                const lines = csvContent.split('\n');
                
                summary += '### Key Metrics\n';
                for (let i = 1; i < lines.length && lines[i].trim(); i++) {
                  const columns = lines[i].split(',');
                  if (columns.length >= 2) {
                    const metric = columns[0].replace(/"/g, '');
                    const value = columns[1].replace(/"/g, '');
                    summary += `- **${metric}**: ${value}\n`;
                  }
                }
                reportFound = true;
                break;
              }
            }
            
            if (!reportFound) {
              // Fallback - try to find Excel file and indicate it exists
              if (fs.existsSync('security_compliance_report.xlsx')) {
                summary += '✅ **Security compliance analysis completed**\n\n';
                summary += '📊 **Report Format**: Excel (.xlsx) with multiple sheets\n';
                summary += '- Security findings with CVE database validation\n';
                summary += '- Regulatory compliance mapping (HIPAA, GDPR, ISO 27001)\n';
                summary += '- Executive summary with key metrics\n';
                reportFound = true;
              }
            }
            
            if (reportFound) {
              summary += '\n📋 **Full Report**: Check the workflow artifacts for the complete security compliance report.\n';
              summary += '⚠️ **Action Required**: Please review all security findings and ensure compliance with regulatory requirements.\n';
              summary += '\n🏥 **Healthcare Compliance**: This analysis validates against HIPAA, GDPR, ISO 27001, IEC 81001-5-1, and FDA requirements.\n';
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: summary
              });
            } else {
              console.log('No security compliance report found to comment.');
            }
          } catch (error) {
            console.log('Could not read or comment security report:', error);
            
            // Fallback comment
            const fallbackSummary = `## 🔒 Security Compliance Analysis
            
Security analysis completed. Please check the workflow artifacts for the detailed compliance report.

⚠️ **Action Required**: Review security findings and ensure regulatory compliance.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: fallbackSummary
            });
          }
